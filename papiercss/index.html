    <title>PapierCSS</title>
    <script>
      (() => {
        const key = "papiercss-docs-theme";
        const stored = localStorage.getItem(key);
        const dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
